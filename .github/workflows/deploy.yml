name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # ── Run Last.fm parser ─────────────────────────────────────────
      - name: Install parser dependencies
        run: npm ci
        working-directory: ./parser

      - name: Run Last.fm parser
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
        run: node index.js
        working-directory: ./parser

      - name: Copy parser output to public
        run: cp parser/output/lastfm-data.json public/lastfm-data.json

      # Commit updated track count cache back so future runs skip API calls
      - name: Commit updated cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add parser/data/track_counts_cache.json public/lastfm-data.json
          git diff --staged --quiet || git commit -m "chore: update Last.fm data + cache [skip ci]"
          git push

      # ── Build & Deploy React app ───────────────────────────────────
      - name: Install app dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
